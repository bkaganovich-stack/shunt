name: Verify package
on:
  push:
    branches: [main, codex/shunt-ui]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r src/web/requirements.txt pytest
      - name: Python and UI tests
        run: |
          python -m pytest tests/ -q
          node --test tests/ui-model.test.cjs
          node --check src/web/static/ui.js
          node --check src/web/static/ui-model.js
      - name: Build Debian package
        run: ./packaging/build.sh
      - name: Verify package contents
        run: python tests/verify_package.py dist/shunt_*_all.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shunt-debian-package
          path: |
            dist/shunt_*_all.deb
            dist/SHA256SUMS
            dist/package-checks.json
          if-no-files-found: error
