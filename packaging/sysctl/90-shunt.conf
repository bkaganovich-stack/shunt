# Kernel settings Shunt needs to route for other machines.
#
# Installed as a conffile: edit it and the change survives upgrades. The values
# are applied at install time and on every boot; iptables.sh also sets the first
# two at runtime, because a gateway that has had them cleared by hand should
# still come up working rather than silently forwarding nothing.

# Forward packets between interfaces. Without this the box is a host, not a
# gateway, and everything behind it goes dark.
net.ipv4.ip_forward=1

# TPROXY hands intercepted connections to a listener bound on loopback, and the
# kernel drops packets routed to 127.0.0.0/8 from a real interface unless this
# is set.
net.ipv4.conf.all.route_localnet=1

# Shunt splits traffic on IPv4 only. A working IPv6 path would carry traffic
# straight out of the WAN port, unsplit and untunnelled -- a leak, not a
# slowdown -- so IPv6 is off rather than merely unused.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1

# BBR with fair queueing. The tunnel is a long path with occasional loss, which
# is where loss-based congestion control gives up throughput it does not have to.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
