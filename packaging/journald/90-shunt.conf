# Shunt — bound the journal.
#
# systemd's default cap is 10% of the filesystem. On this appliance that is
# 2.6 GB of a 26 GB eMMC, and the live gateway had reached 2.2 GB — a quarter
# of everything on the disk, for logs nobody had read. There is no setting in
# journald.conf on that box: the default was simply never questioned.
#
# 200 MB is still weeks of an idle gateway and days of a busy one, and it is
# the difference between a log that can fill a disk and one that cannot.
# Written as a drop-in rather than an edit to journald.conf so that an
# administrator who wants a different number can say so in a file dpkg will
# never touch.
[Journal]
SystemMaxUse=200M
