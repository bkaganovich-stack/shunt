# Shunt: needrestart must never restart the remote-access unit on its own.
#
# An upgrade is often run through that very session. needrestart runs from
# apt's DPkg::Post-Invoke hook after dpkg finishes, sees that
# remote_access_runner.py changed, and restarts the unit, which cuts the ssh
# that apt is running in (2026-11-27, 2.33.1 -> 2.33.3). The runner picks up
# new code between sessions without a restart.
$nrconf{override_rc}{qr(^shunt-remote-access\.service$)} = 0;
